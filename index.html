<!DOCTYPE html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A language learning app that lets you translate a diary written in your native language into a foreign language, helping you learn the meanings and pronunciations of words and sentences.">
	<title>LinguaDiary</title>
	<link rel="stylesheet" href="css/index.css">
</head>
<body>
	<main>
		<h1>LinguaDiary</h1>
    <div class="action-btn">
      <button class="signup-btn action-btn">Sign Up</button>
      <button class="signin-btn action-btn">Sign In</button>
     
    </div>
    
    
    <div class="signup-modal modal hidden">
      <label>User Name</label>
      <input type="text" class="auth-input signup-username">

      <label>Email</label>
      <input type="email" class="auth-input signup-email">

      <label>Password</label>
      <input type="password" class="auth-input signup-password">

      <button class="register-btn action-btn">Create Account</button>
      <button class="cancel-btn action-btn">Cancel</button>
    </div>

    <div class="signin-modal modal hidden">
      <label>Email</label>
      <input type="email" class="auth-input signin-email">

      <label>Password</label>
      <input type="password" class="auth-input signin-password">     
      
      <button class="login-btn action-btn">Log in</button>
      <button class="cancel-btn action-btn">Cancel</button>
    </div>

	</main>
	<script src="script/index.js"></script>
</body>
