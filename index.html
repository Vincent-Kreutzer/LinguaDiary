<!DOCTYPE html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A language learning app that lets you translate a diary written in your native language into a foreign language, helping you learn the meanings and pronunciations of words and sentences.">
	<title>Foreign Diary</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<main>
		

		<div class="book-area">

			<div class="left-page page">
				<div class="navigation-area">
					<button class="top-btn">TOP</button>
					<button class="list-btn">LIST</button>
				</div>
				<textarea class="diary-input diary"></textarea>
			</div>

			<div class="right-page page">
				<input type="time" class="diary-date">
				<div class="diary-output diary"></div>

				<div class="action-area">
					<button class="translate action-btn">TRANSLATE</button>
					<button class="speech action-btn">SPEECH</button>
					<button class="save action-btn">SAVE</button>
				</div>
			</div>
		</div>
		
		
	</main>
	<script src="script/diary.js"></script>
</body>
